# wrangler.toml — Cloudflare Pages configuration for this project.
# One value you must fill in, marked FILL IN below. Full walkthrough: docs/deploy.md.

name = "baseball-kenya"
compatibility_date = "2026-09-01"
pages_build_output_dir = "."

# D1 database binding. The database_id is filled in for you by
# `wrangler d1 create baseball-kenya` — copy the id it prints into the line
# below (docs/deploy.md, step 3).
[[d1_databases]]
binding = "DB"
database_name = "baseball-kenya"
database_id = "FILL IN — from `wrangler d1 create baseball-kenya`"
