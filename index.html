<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Baseball Kenya</title>
  <meta name="description" content="Fixtures, verified scores, standings and team profiles for baseball across Kenya.">
  <meta name="theme-color" content="#ffffff">
  <script>
    // Applied before the stylesheets paint, so there is no flash of the wrong theme.
    try {
      var t = localStorage.getItem('bk-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/utilities/buttons.css">
  <link rel="stylesheet" href="styles/components/header.css">
  <link rel="stylesheet" href="styles/components/hero.css">
  <link rel="stylesheet" href="styles/components/card.css">

</body>
</html>
